<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Deployment — SCCM Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/slide-panel.css">
  <link rel="stylesheet" href="/css/datatables.min.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar"></aside>
    <div class="main-wrapper">
      <header class="header"></header>
      <main class="main-content">
        <div class="metrics-grid" id="metrics"></div>
        <div class="charts-grid">
          <div class="chart-card">
            <h3 data-i18n="app.deployStatusDist">Deployment Durum Dagilimi</h3>
            <div class="chart-container"><canvas id="chartStatus"></canvas></div>
          </div>
          <div class="chart-card">
            <h3 data-i18n="app.topFailed">En Cok Basarisiz (Top 5)</h3>
            <div class="chart-container"><canvas id="chartFailed"></canvas></div>
          </div>
        </div>

        <div class="tab-bar">
          <button class="tab active" data-tab="tab-app" data-i18n="app.appModel">Application Model</button>
          <button class="tab" data-tab="tab-pkg" data-i18n="app.pkgProgram">Package / Program</button>
        </div>

        <div id="tab-app" class="tab-content active">
          <div class="table-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
              <h3 data-i18n="app.appDeployment">Application Deployment</h3>
              <button class="btn btn-secondary btn-export" data-target="app" data-i18n="common.csvExport">CSV Export</button>
            </div>
            <table id="appTable" class="display" style="width:100%">
              <thead><tr>
                <th data-i18n="upd.deploymentName">Deployment Adi</th><th>Collection</th><th data-i18n="upd.date">Tarih</th>
                <th data-i18n="common.total">Toplam</th><th data-i18n="app.successful">Basarili</th><th>Failed</th><th data-i18n="app.inProgress">Devam Eden</th><th data-i18n="app.successRate">Basari %</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div id="tab-pkg" class="tab-content">
          <div class="table-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
              <h3 data-i18n="app.pkgDeployment">Package/Program Deployment</h3>
              <button class="btn btn-secondary btn-export" data-target="pkg" data-i18n="common.csvExport">CSV Export</button>
            </div>
            <table id="pkgTable" class="display" style="width:100%">
              <thead><tr>
                <th data-i18n="app.advName">Advertisement Adi</th><th data-i18n="app.package">Paket</th><th>Collection</th><th data-i18n="upd.date">Tarih</th>
                <th data-i18n="common.total">Toplam</th><th data-i18n="app.successful">Basarili</th><th>Failed</th><th data-i18n="app.running">Calisanlar</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/lib/jquery.min.js"></script>
  <script src="/js/lib/datatables.min.js"></script>
  <script src="/js/lib/chart.min.js"></script>
  <script src="/js/lang.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/slide-panel.js"></script>
  <script src="/js/export.js"></script>
  <script src="/js/pages/app-deployment.js"></script>
</body>
</html>
