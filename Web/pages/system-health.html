<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Sagligi — SCCM Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/slide-panel.css">
  <link rel="stylesheet" href="/css/datatables.min.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar"></aside>
    <div class="main-wrapper">
      <header class="header"></header>
      <main class="main-content">

        <div id="alertArea"></div>
        <div class="metrics-grid" id="metrics"></div>

        <div class="charts-grid">
          <div class="chart-card">
            <h3 data-i18n="sys.querySuccessRate">Sorgu Basari / Hata Orani</h3>
            <div class="chart-container"><canvas id="chartQueryStatus"></canvas></div>
          </div>
          <div class="chart-card">
            <h3 data-i18n="sys.queryTimes">Sorgu Calisma Sureleri</h3>
            <div class="chart-container"><canvas id="chartQueryTimes"></canvas></div>
          </div>
        </div>

        <!-- Live Sync Status Panel -->
        <div class="table-card" style="margin-bottom:20px">
          <h3 data-i18n="sys.liveSyncStatus">&#8635; Canli Sync Durumu</h3>
          <div id="syncStatusPanel"></div>
        </div>

        <div class="tab-bar">
          <button class="tab active" data-tab="tab-queries" data-i18n="sys.queryStatus">Sorgu Durumlari</button>
          <button class="tab" data-tab="tab-logs" data-i18n="sys.cacheLog">Cache Log</button>
          <button class="tab" data-tab="tab-data" data-i18n="sys.dataFiles">Veri Dosyalari</button>
        </div>

        <div id="tab-queries" class="tab-content active">
          <div class="table-card">
            <h3 data-i18n="sys.cacheQueryStatus">Cache Sorgu Durumlari</h3>
            <table id="queryTable" class="display" style="width:100%">
              <thead><tr>
                <th data-i18n="sys.query">Sorgu</th><th data-i18n="asset.status">Durum</th><th data-i18n="sys.recordCount">Kayit Sayisi</th>
                <th data-i18n="sys.duration">Sure (sn)</th><th data-i18n="sys.lastRun">Son Calistirma</th><th data-i18n="common.error">Hata</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div id="tab-logs" class="tab-content">
          <div class="table-card">
            <h3 data-i18n="sys.lastCacheLog">Son Cache Refresh Logu</h3>
            <pre class="log-viewer" id="logViewer">Log yukleniyor...</pre>
          </div>
        </div>

        <div id="tab-data" class="tab-content">
          <div class="table-card">
            <h3 data-i18n="sys.dataFileStatus">Veri Dosyalari Durumu</h3>
            <table id="dataFilesTable" class="display" style="width:100%">
              <thead><tr>
                <th data-i18n="sys.file">Dosya</th><th data-i18n="sys.size">Boyut</th><th data-i18n="sys.recordCount">Kayit Sayisi</th><th data-i18n="asset.status">Durum</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>
  <script src="/js/lib/jquery.min.js"></script>
  <script src="/js/lib/datatables.min.js"></script>
  <script src="/js/lib/chart.min.js"></script>
  <script src="/js/lang.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/slide-panel.js"></script>
  <script src="/js/export.js"></script>
  <script src="/js/pages/system-health.js"></script>
</body>
</html>
