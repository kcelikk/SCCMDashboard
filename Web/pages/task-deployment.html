<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OS / Task Deployment — SCCM Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/slide-panel.css">
  <link rel="stylesheet" href="/css/datatables.min.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar"></aside>
    <div class="main-wrapper">
      <header class="header"></header>
      <main class="main-content">
        <div id="alertArea"></div>
        <div class="metrics-grid" id="metrics"></div>
        <div class="charts-grid">
          <div class="chart-card">
            <h3 id="chartTitle1" data-i18n="task.deployStatus">Deployment Status</h3>
            <div class="chart-container"><canvas id="chartStatus"></canvas></div>
          </div>
          <div class="chart-card">
            <h3 id="chartTitle2" data-i18n="task.deployMethod">Deployment Method</h3>
            <div class="chart-container"><canvas id="chartMethod"></canvas></div>
          </div>
        </div>
        <div class="table-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h3 data-i18n="task.deployList">OS / Task Sequence Deployments</h3>
            <button class="btn btn-secondary" id="btnExport" data-i18n="common.csvExport">CSV Export</button>
          </div>
          <table id="tsTable" class="display" style="width:100%">
            <thead><tr>
              <th data-i18n="task.taskSequence">Task Sequence</th><th data-i18n="task.deployment">Deployment</th><th>Collection</th>
              <th data-i18n="task.method">Method</th><th data-i18n="task.purpose">Purpose</th><th data-i18n="common.total">Total</th>
              <th data-i18n="task.success">Success</th><th>Failed</th><th>Running</th><th data-i18n="upd.date">Date</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/lib/jquery.min.js"></script>
  <script src="/js/lib/datatables.min.js"></script>
  <script src="/js/lib/chart.min.js"></script>
  <script src="/js/lang.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/slide-panel.js"></script>
  <script src="/js/export.js"></script>
  <script src="/js/pages/task-deployment.js"></script>
</body>
</html>
