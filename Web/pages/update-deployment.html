<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Deployment — SCCM Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/slide-panel.css">
  <link rel="stylesheet" href="/css/datatables.min.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar"></aside>
    <div class="main-wrapper">
      <header class="header"></header>
      <main class="main-content">

        <!-- Metric Cards -->
        <div class="metrics-grid" id="metrics"></div>

        <!-- Charts -->
        <div class="charts-grid">
          <div class="chart-card">
            <h3 data-i18n="upd.compStatus">Compliance Durumu</h3>
            <div class="chart-container"><canvas id="chartCompliance"></canvas></div>
          </div>
          <div class="chart-card">
            <h3 data-i18n="upd.last30trend">Son 30 Gun Trend</h3>
            <div class="chart-container"><canvas id="chartTrend"></canvas></div>
          </div>
        </div>

        <!-- Table -->
        <div class="table-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h3 data-i18n="upd.deploymentList">Update Deployment Listesi</h3>
            <button class="btn btn-secondary" id="btnExport" data-i18n="common.csvExport">CSV Export</button>
          </div>
          <table id="deploymentTable" class="display" style="width:100%">
            <thead>
              <tr>
                <th data-i18n="upd.deploymentName">Deployment Adi</th>
                <th>Collection</th>
                <th data-i18n="upd.date">Tarih</th>
                <th data-i18n="common.total">Toplam</th>
                <th>Installed</th>
                <th>Required</th>
                <th>Failed</th>
                <th>Unknown</th>
                <th>Compliance %</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <script src="/js/lib/jquery.min.js"></script>
  <script src="/js/lib/datatables.min.js"></script>
  <script src="/js/lib/chart.min.js"></script>
  <script src="/js/lang.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/slide-panel.js"></script>
  <script src="/js/export.js"></script>
  <script src="/js/pages/update-deployment.js"></script>
</body>
</html>
