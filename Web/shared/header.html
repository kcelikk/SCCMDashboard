<div class="header-left">
  <h2 id="page-title">Dashboard</h2>
</div>
<div class="header-right">
  <button class="btn-refresh" id="btn-manual-refresh" data-i18n-title="common.refresh">
    <span class="refresh-icon" id="refresh-icon">&#8635;</span>
    <span class="refresh-text" data-i18n="common.refresh">Refresh</span>
  </button>
  <div class="cache-info" id="cache-status">
    <span class="dot"></span>
    <span id="cache-time" data-i18n="common.loading">Loading...</span>
  </div>
  <button class="lang-toggle" id="lang-toggle" title="TR / EN">TR</button>
  <button class="theme-toggle" id="theme-toggle" title="Theme">&#9790;</button>
  <span class="user-info" id="user-name"></span>
</div>
